<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ファンタジーすごろく</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="title-screen" id="title" hidden aria-label="タイトル"></section>
    <section class="select" id="select" hidden aria-label="キャラクター選択"></section>
    <main class="app">
      <section class="board" id="board" aria-label="盤面">
        <div class="center" id="center"></div>
      </section>
      <aside class="side">
        <div class="sound-bar">
          <button type="button" id="soundbtn" aria-pressed="true">🔊 効果音オン</button>
        </div>
        <div class="speed-bar" id="speedbar" role="group" aria-label="CPUの速度">
          <span class="speed-label">速度</span>
          <button type="button" data-speed="normal">ふつう</button>
          <button type="button" data-speed="fast">速い</button>
          <button type="button" data-speed="skip">スキップ</button>
        </div>
        <section class="dock" id="dock" aria-label="操作" aria-live="polite"></section>
        <section class="hand" id="hand" aria-label="あなたの手札"></section>
        <ol class="players" id="players" aria-label="プレイヤー"></ol>
        <section class="log-wrap" aria-label="出来事">
          <h2>出来事</h2>
          <ol class="log" id="log"></ol>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
